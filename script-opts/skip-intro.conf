# silence threshold in dB and minimum silence length in seconds
quietness=-30
duration=0.5

# fast-forward speed for local files
max_speed=100

# fast-forward speed range for network streams, scaled to the buffered amount
stream_max_speed=30
stream_min_speed=2

# skip a matching chapter if it starts within this many seconds
chapter_lookahead=10

# give up and return after this many seconds without silence
max_skip=150
